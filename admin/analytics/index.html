<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeTools AI — Analytics</title><link rel="stylesheet" href="/assets/app.css?v=7">
<style>
body{background:#f7f8fc}.adminWrap{max-width:1180px;margin:0 auto;padding:40px 18px}.adminHead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.adminHead h1{margin:0}.adminGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #e7e8f2;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(30,25,80,.06)}.stat small{display:block;color:#777}.stat strong{font-size:30px;display:block;margin-top:7px}.panels{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.panel h2{font-size:18px;margin:0 0 14px}.login{max-width:430px;margin:90px auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.08)}.login input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:#5b3df5;color:white;font-weight:700}.out{background:#eee;color:#222}.msg{color:#c33;min-height:20px}.table{width:100%;border-collapse:collapse}.table td{padding:8px;border-bottom:1px solid #eee}.bar{height:9px;background:#5b3df5;border-radius:9px;margin-top:5px;opacity:.8}.chart{display:flex;align-items:end;height:180px;gap:4px}.col{flex:1;min-width:3px;background:#5b3df5;border-radius:4px 4px 0 0}.muted{color:#777}@media(max-width:800px){.adminGrid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.adminHead{align-items:flex-start}.stat strong{font-size:24px}}
</style></head><body><div id="app"></div>
<script>
(function(){
const app=document.getElementById('app'),fa=/^fa/i.test(navigator.language||'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function login(){app.innerHTML='<div class="login"><h1>FreeTools AI</h1><p>Admin Analytics</p><form id="f"><label>Email</label><input id="e" type="email" required autocomplete="username"><label>Password</label><input id="p" type="password" required autocomplete="current-password"><div class="msg" id="m"></div><button class="btn">Sign in</button></form></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('e').value,password:document.getElementById('p').value})});let d=await r.json();if(r.ok)load();else document.getElementById('m').textContent=d.error||'Login failed.'}}
function list(rows,key){if(!rows?.length)return '<p class="muted">No data yet.</p>';let max=Math.max(...rows.map(x=>Number(x.count)||0),1);return '<table class="table">'+rows.map(x=>'<tr><td>'+esc(x[key])+'</td><td>'+esc(x.count)+'</td></tr><tr><td colspan="2"><div class="bar" style="width:'+((Number(x.count)||0)/max*100)+'%"></div></td></tr>').join('')+'</table>'}
async function load(){let r=await fetch('/api/admin-stats');if(r.status===401){login();return}let d=await r.json();if(!r.ok){app.innerHTML='<div class="login"><h2>Error</h2><p>'+esc(d.error)+'</p></div>';return}
app.innerHTML='<main class="adminWrap"><div class="adminHead"><div><small>PRIVATE DASHBOARD</small><h1>FreeTools AI Analytics</h1></div><button class="btn out" id="logout">Sign out</button></div><div class="adminGrid"><div class="stat"><small>Today</small><strong>'+d.today.users+'</strong><span>visitors</span></div><div class="stat"><small>7 days</small><strong>'+d.week.users+'</strong><span>visitors</span></div><div class="stat"><small>30 days</small><strong>'+d.month.users+'</strong><span>visitors</span></div><div class="stat"><small>Online now</small><strong>'+d.online+'</strong><span>active</span></div><div class="stat"><small>Total views</small><strong>'+d.total.count+'</strong></div><div class="stat"><small>AI page views</small><strong>'+d.ai+'</strong></div><div class="stat"><small>App downloads</small><strong>'+d.downloads+'</strong></div><div class="stat"><small>Total visitors</small><strong>'+d.total.users+'</strong></div></div><div class="panels"><section class="panel"><h2>Last 30 days</h2><div class="chart">'+d.daily.map(x=>'<div class="col" title="'+esc(x.day)+': '+x.views+' views" style="height:'+Math.max(4,Math.min(100,x.views/(Math.max(...d.daily.map(y=>y.views),1))*100))+'%"></div>').join('')+'</div></section><section class="panel"><h2>Devices</h2>'+list(d.devices,'device')+'</section><section class="panel"><h2>Popular pages</h2>'+list(d.topPages,'path')+'</section><section class="panel"><h2>Countries</h2>'+list(d.countries,'country')+'</section><section class="panel"><h2>Popular clicks</h2>'+list(d.topEvents,'target')+'</section></div></main>';document.getElementById('logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});login()}}
load();
})();
</script></body></html>
