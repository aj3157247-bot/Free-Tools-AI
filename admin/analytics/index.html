<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeTools AI — Admin</title><link rel="stylesheet" href="/assets/app.css?v=7">
<style>
body{background:#f7f8fc}.adminWrap{max-width:1200px;margin:0 auto;padding:34px 18px 60px}.adminHead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.adminHead h1{margin:4px 0}.adminNav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tab{border:1px solid #ddd;border-radius:10px;background:#fff;padding:10px 15px;cursor:pointer;font-weight:700}.tab.active{background:#5b3df5;color:#fff;border-color:#5b3df5}.adminGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #e7e8f2;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(30,25,80,.06)}.stat small{display:block;color:#777}.stat strong{font-size:30px;display:block;margin-top:7px}.panels{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.panel h2{font-size:18px;margin:0 0 14px}.login{max-width:430px;margin:90px auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.08)}.login input,.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#5b3df5;color:white;font-weight:700}.out,.danger{background:#eee;color:#222}.danger{background:#fff0f0;color:#b42318}.msg{color:#c33;min-height:20px}.table{width:100%;border-collapse:collapse}.table td{padding:9px;border-bottom:1px solid #eee;vertical-align:top}.bar{height:9px;background:#5b3df5;border-radius:9px;margin-top:5px;opacity:.8}.chart{display:flex;align-items:end;height:180px;gap:4px}.col{flex:1;min-width:3px;background:#5b3df5;border-radius:4px 4px 0 0}.muted{color:#777}.adsTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.adsList{display:grid;gap:12px}.adCard{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;border:1px solid #e7e8f2;border-radius:14px;padding:12px;background:#fff}.adThumb{width:110px;height:72px;border-radius:10px;object-fit:cover;background:#eef0f7}.adThumb.noimg{display:flex;align-items:center;justify-content:center;font-size:28px}.adMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0efff;font-size:12px}.pill.active{background:#e8f8ef;color:#147a43}.pill.paused{background:#fff4dd;color:#8a5a00}.pill.draft{background:#eee;color:#666}.adActions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.editor{display:none;margin-bottom:16px}.editor.open{display:block}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.help{font-size:12px;color:#777;margin-top:-8px;margin-bottom:8px}.miniStats{display:flex;gap:12px;flex-wrap:wrap;color:#555;font-size:13px}.empty{padding:28px;text-align:center;color:#777;border:1px dashed #d5d6e0;border-radius:14px}.hidden{display:none!important}@media(max-width:850px){.adminGrid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.adCard{grid-template-columns:80px 1fr}.adThumb{width:80px;height:60px}.adActions{grid-column:1/-1;justify-content:flex-start}.formGrid{grid-template-columns:1fr}}@media(max-width:520px){.adminGrid{grid-template-columns:1fr 1fr}.adminHead{align-items:flex-start}.stat strong{font-size:24px}.adCard{grid-template-columns:1fr}.adThumb{width:100%;height:120px}}
</style></head><body><div id="app"></div>
<script>
(function(){
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString();
function login(){app.innerHTML='<div class="login"><h1>FreeTools AI</h1><p>Private Admin Dashboard</p><form id="f"><label>Email</label><input id="e" type="email" required autocomplete="username"><label>Password</label><input id="p" type="password" required autocomplete="current-password"><div class="msg" id="m"></div><button class="btn">Sign in</button></form></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('e').value,password:document.getElementById('p').value})});let d=await r.json();if(r.ok)load();else document.getElementById('m').textContent=d.error||'Login failed.'}}
function list(rows,key){if(!rows?.length)return '<p class="muted">No data yet.</p>';let max=Math.max(...rows.map(x=>Number(x.count)||0),1);return '<table class="table">'+rows.map(x=>'<tr><td>'+esc(x[key])+'</td><td>'+esc(x.count)+'</td></tr><tr><td colspan="2"><div class="bar" style="width:'+((Number(x.count)||0)/max*100)+'%"></div></td></tr>').join('')+'</table>'}
async function analytics(){let r=await fetch('/api/admin-stats');if(r.status===401){login();return}let d=await r.json();if(!r.ok){app.innerHTML='<div class="login"><h2>Error</h2><p>'+esc(d.error)+'</p></div>';return}document.getElementById('content').innerHTML='<div class="adminGrid"><div class="stat"><small>Today</small><strong>'+d.today.users+'</strong><span>visitors</span></div><div class="stat"><small>7 days</small><strong>'+d.week.users+'</strong><span>visitors</span></div><div class="stat"><small>30 days</small><strong>'+d.month.users+'</strong><span>visitors</span></div><div class="stat"><small>Online now</small><strong>'+d.online+'</strong><span>active</span></div><div class="stat"><small>Total views</small><strong>'+d.total.count+'</strong></div><div class="stat"><small>AI page views</small><strong>'+d.ai+'</strong></div><div class="stat"><small>App downloads</small><strong>'+d.downloads+'</strong></div><div class="stat"><small>Total visitors</small><strong>'+d.total.users+'</strong></div></div><div class="panels"><section class="panel"><h2>Last 30 days</h2><div class="chart">'+d.daily.map(x=>'<div class="col" title="'+esc(x.day)+': '+x.views+' views" style="height:'+Math.max(4,Math.min(100,x.views/(Math.max(...d.daily.map(y=>y.views),1))*100))+'%"></div>').join('')+'</div></section><section class="panel"><h2>Devices</h2>'+list(d.devices,'device')+'</section><section class="panel"><h2>Popular pages</h2>'+list(d.topPages,'path')+'</section><section class="panel"><h2>Countries</h2>'+list(d.countries,'country')+'</section><section class="panel"><h2>Popular clicks</h2>'+list(d.topEvents,'target')+'</section></div>'}
function editor(ad){const a=ad||{};return '<section class="panel editor open" id="editor"><div class="adsTop"><h2 style="margin:0">'+(a.id?'Edit advertisement':'Create advertisement')+'</h2><button class="tab" id="cancelEdit">Cancel</button></div><form id="adForm"><input type="hidden" id="adId" value="'+esc(a.id||'')+'"><div class="formGrid"><div class="field"><label>Title</label><input id="adTitle" required maxlength="160" value="'+esc(a.title||'')+'"></div><div class="field"><label>Destination URL</label><input id="adUrl" type="url" required placeholder="https://example.com" value="'+esc(a.target_url||'')+'"></div><div class="field full"><label>Description</label><textarea id="adDesc" maxlength="500">'+esc(a.description||'')+'</textarea></div><div class="field"><label>Image URL</label><input id="adImage" type="url" placeholder="https://.../banner.jpg" value="'+esc(a.image_url||'')+'"><div class="help">Optional. Use a public HTTPS image URL.</div></div><div class="field"><label>Placement</label><select id="adPlacement"><option value="top" '+(a.placement==='top'?'selected':'')+'>Top banner</option><option value="home" '+(a.placement==='home'?'selected':'')+'>Homepage</option><option value="tools" '+(a.placement==='tools'?'selected':'')+'>Tool pages</option><option value="bottom" '+(a.placement==='bottom'?'selected':'')+'>Bottom banner</option></select></div><div class="field"><label>Status</label><select id="adStatus"><option value="draft" '+(a.status==='draft'?'selected':'')+'>Draft</option><option value="active" '+(a.status==='active'?'selected':'')+'>Active</option><option value="paused" '+(a.status==='paused'?'selected':'')+'>Paused</option></select></div><div class="field"><label>Start (optional)</label><input id="adStart" type="datetime-local"></div><div class="field"><label>End (optional)</label><input id="adEnd" type="datetime-local"></div></div><div class="msg" id="adMsg"></div><button class="btn">'+(a.id?'Save changes':'Create ad')+'</button></form></section>'}
function isoLocal(ts){if(!ts)return '';let d=new Date(ts*1000);let p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function toTs(id){let v=document.getElementById(id).value;return v?Math.floor(new Date(v).getTime()/1000):0}
async function ads(){let r=await fetch('/api/ads');if(r.status===401){login();return}let d=await r.json();if(!r.ok){document.getElementById('content').innerHTML='<div class="panel"><p>'+esc(d.error)+'</p></div>';return}let rows=d.ads||[];document.getElementById('content').innerHTML='<div class="adsTop"><div><h2 style="margin:0">Ads Manager</h2><p class="muted">Create and manage direct advertisements shown on the public site.</p></div><button class="btn" id="newAd">+ New advertisement</button></div>'+editor()+ '<section class="panel"><div class="adsList">'+(rows.length?rows.map(a=>'<article class="adCard"><div>'+(a.image_url?'<img class="adThumb" src="'+esc(a.image_url)+'" alt="">':'<div class="adThumb noimg">📢</div>')+'</div><div><h3 style="margin:0 0 4px">'+esc(a.title)+'</h3><div class="muted">'+esc(a.description||'')+'</div><div class="miniStats"><span>👁 '+fmt(a.impressions)+'</span><span>🖱 '+fmt(a.clicks)+'</span><span>CTR '+(a.impressions?((a.clicks/a.impressions)*100).toFixed(2):'0.00')+'%</span></div><div class="adMeta"><span class="pill '+esc(a.status)+'">'+esc(a.status)+'</span><span class="pill">'+esc(a.placement)+'</span></div></div><div class="adActions"><button class="tab editAd" data-id="'+a.id+'">Edit</button><button class="tab danger delAd" data-id="'+a.id+'">Delete</button></div></article>').join(''):'<div class="empty">No advertisements yet. Create your first one.</div>')+'</div></section>';
 document.getElementById('editor').classList.remove('open');
 document.getElementById('newAd').onclick=()=>{document.getElementById('editor').classList.add('open');window.scrollTo({top:0,behavior:'smooth'})};
 document.getElementById('cancelEdit').onclick=()=>document.getElementById('editor').classList.remove('open');
 document.getElementById('adForm').onsubmit=saveAd;
 document.querySelectorAll('.editAd').forEach(b=>b.onclick=async()=>{let a=rows.find(x=>String(x.id)===b.dataset.id);if(!a)return;document.getElementById('editor').outerHTML=editor(a);document.getElementById('editor').classList.add('open');document.getElementById('adStart').value=isoLocal(a.start_at);document.getElementById('adEnd').value=isoLocal(a.end_at);document.getElementById('cancelEdit').onclick=()=>document.getElementById('editor').classList.remove('open');document.getElementById('adForm').onsubmit=saveAd;window.scrollTo({top:0,behavior:'smooth'})});
 document.querySelectorAll('.delAd').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this advertisement?'))return;await fetch('/api/ads?id='+b.dataset.id,{method:'DELETE'});ads()});
}
async function saveAd(e){e.preventDefault();let id=document.getElementById('adId').value;let data={title:document.getElementById('adTitle').value,description:document.getElementById('adDesc').value,image_url:document.getElementById('adImage').value,target_url:document.getElementById('adUrl').value,placement:document.getElementById('adPlacement').value,status:document.getElementById('adStatus').value,start_at:toTs('adStart'),end_at:toTs('adEnd')};let r=await fetch('/api/ads'+(id?'?id='+id:''),{method:id?'PATCH':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let d=await r.json();if(r.ok)ads();else document.getElementById('adMsg').textContent=d.error||'Could not save advertisement.'}
async function load(){let r=await fetch('/api/admin-stats');if(r.status===401){login();return}if(!r.ok){let d=await r.json();app.innerHTML='<div class="login"><h2>Error</h2><p>'+esc(d.error)+'</p></div>';return}app.innerHTML='<main class="adminWrap"><div class="adminHead"><div><small>PRIVATE DASHBOARD</small><h1>FreeTools AI Admin</h1></div><button class="btn out" id="logout">Sign out</button></div><div class="adminNav"><button class="tab active" id="analyticsTab">📊 Analytics</button><button class="tab" id="adsTab">📢 Ads Manager</button></div><div id="content"></div></main>';document.getElementById('logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});login()};document.getElementById('analyticsTab').onclick=()=>{document.getElementById('analyticsTab').classList.add('active');document.getElementById('adsTab').classList.remove('active');analytics()};document.getElementById('adsTab').onclick=()=>{document.getElementById('adsTab').classList.add('active');document.getElementById('analyticsTab').classList.remove('active');ads()};analytics()}
load();
})();
</script></body></html>
