<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compressor | FreeTools AI</title><meta name="description" content="Compress image-heavy PDFs by rebuilding pages at a lower image quality."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>PDF Compressor</h1><p>Compress image-heavy PDFs by rebuilding pages at a lower image quality.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop a PDF</strong>or tap to choose</div><div id="result" class="status"></div><div class="notice">This method is intended for image-heavy PDFs and may reduce image quality.</div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.2/dist/jspdf.umd.min.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.worker.min.mjs';setupDrop(async f=>{result.textContent='Compressing…';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out;for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),v=p.getViewport({scale:1.3}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const jpg=c.toDataURL('image/jpeg',.62);if(n===1)out=new jspdf.jsPDF({unit:'px',format:[c.width,c.height],compress:true});else out.addPage([c.width,c.height]);out.addImage(jpg,'JPEG',0,0,c.width,c.height)}const b=out.output('blob');result.innerHTML=`Original: ${humanSize(f.size)} → New: ${humanSize(b.size)}`;downloadBlob(b,f.name.replace(/\.pdf$/i,'')+'-compressed.pdf')}catch(e){result.textContent=e.message}},'application/pdf')</script><script src="/assets/site.js"></script></body></html>
