<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Word | FreeTools AI</title><meta name="description" content="Extract selectable PDF text and create a real editable DOCX in your browser."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>PDF to Word</h1><p>Extract selectable PDF text and create a real editable DOCX in your browser.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop a PDF</strong>or tap to choose</div><div id="result" class="status"></div><div class="notice">For scanned PDFs with no selectable text, use OCR first.</div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.worker.min.mjs';setupDrop(async f=>{result.textContent='Reading PDF…';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,ps=[];for(let n=1;n<=pdf.numPages;n++){const c=await (await pdf.getPage(n)).getTextContent(),t=c.items.map(x=>x.str).join(' ').trim();if(t)ps.push(new docx.Paragraph({text:t}))}if(!ps.length){result.textContent='No selectable text found. Use OCR for scanned PDFs.';return}const d=new docx.Document({sections:[{children:ps}]}),b=await docx.Packer.toBlob(d);result.textContent='';downloadBlob(b,f.name.replace(/\.pdf$/i,'')+'.docx')}catch(e){result.textContent=e.message}},'application/pdf')</script></body></html>
