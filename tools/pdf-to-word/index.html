<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Word | FreeTools AI</title><meta name="description" content="Extract selectable PDF text and create a real editable DOCX in your browser."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>PDF to Word</h1><p>Extract selectable PDF text and create a real editable DOCX in your browser.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop a PDF</strong>or tap to choose</div><div id="result" class="status"></div><div class="notice">For scanned PDFs with no selectable text, use OCR first.</div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.worker.min.mjs';const RTL=/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/;setupDrop(async f=>{result.textContent='Reading PDF…';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,ps=[];for(let n=1;n<=pdf.numPages;n++){const c=await (await pdf.getPage(n)).getTextContent(),lines=[];let cur='',y=null,prev=null;const flush=()=>{if(cur.trim())lines.push(cur.trim());cur='';prev=null};for(const it of c.items){if(typeof it.str!=='string')continue;const iy=it.transform?it.transform[5]:0;if(y!==null&&Math.abs(iy-y)>3)flush();if(prev&&!/\s$/.test(cur)&&!/^\s/.test(it.str)){const gap=Math.min(Math.abs(it.transform[4]-(prev.transform[4]+prev.width)),Math.abs(prev.transform[4]-(it.transform[4]+it.width)));if(gap>1.5)cur+=' '}cur+=it.str;y=iy;prev=it;if(it.hasEOL)flush()}flush();let first=true;for(const t of lines){const rtl=RTL.test(t);ps.push(new docx.Paragraph({pageBreakBefore:first&&n>1&&ps.length>0,bidirectional:rtl,children:[new docx.TextRun({text:t,rightToLeft:rtl,font:'Arial'})]}));first=false}}if(!ps.length){result.textContent='No selectable text found. Use OCR for scanned PDFs.';return}const d=new docx.Document({sections:[{children:ps}]}),b=await docx.Packer.toBlob(d);result.textContent='';downloadBlob(b,f.name.replace(/\.pdf$/i,'')+'.docx')}catch(e){result.textContent=e.message}},'application/pdf')</script><script src="/assets/site.js"></script></body></html>
