<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Word — Free PDF Converter</title><meta name="description" content="Convert text-based PDF files into editable Word documents for free."><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">FreeTools<span>AI</span></a></header><main class="tool-page"><a class="back" href="/">← All tools</a><h1>PDF to Word</h1><p>Create a DOCX from selectable text in a PDF.</p><div class="tool-card"><input id="file" type="file" accept="application/pdf" hidden><div id="drop" class="drop">Drop a PDF or tap to choose</div><div id="out"></div><div class="notice">This browser version handles text-based PDFs. Scanned PDFs need OCR, which can be connected through the AI/Worker layer.</div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script type="module">import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";setupDrop(file,drop,async fs=>{const f=fs[0];if(!f)return;out.textContent="Extracting PDF text…";try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),c=await page.getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\\n\\n"}const blob=new Blob([t],{type:"application/msword"});out.innerHTML="";dl(blob,f.name.replace(/\\.pdf$/i,"")+".doc");}catch(e){out.textContent=e.message}})</script><script src="/tools/common.js"></script></body></html>
