<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter — JPG PNG WebP | FreeTools AI</title><meta name="description" content="Convert images between JPG, PNG and WebP for free in your browser."><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">FreeTools<span>AI</span></a></header><main class="tool-page"><a class="back" href="/">← All tools</a><h1>Image Converter</h1><p>Convert JPG, PNG and WebP images instantly in your browser.</p><div class="tool-card"><input id="file" type="file" accept="image/*" hidden><div id="drop" class="drop"><b>Drop an image here</b><br>or tap to choose a file</div><div class="row"><label>Format <select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><label>Quality <input id="quality" type="range" min=".1" max="1" step=".05" value=".9"></label></div><div id="out" class="result"></div></div></main><script src="/tools/common.js"></script><script>setupDrop(file,drop,async fs=>{const f=fs[0];if(!f)return;out.textContent="Converting…";try{const s=await imageSize(f);const b=await imageCanvas(f,s.w,s.h,fmt.value,+quality.value);out.innerHTML="";dl(b,f.name.replace(/\.[^.]+$/,"")+"."+({ "image/jpeg":"jpg","image/png":"png","image/webp":"webp"})[fmt.value])}catch(e){out.textContent=e.message}})</script></body></html>
