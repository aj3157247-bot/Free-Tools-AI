<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter | FreeTools AI</title><meta name="description" content="Convert JPG, PNG and WebP images in your browser."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>Image Converter</h1><p>Convert JPG, PNG and WebP images in your browser.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop an image</strong>or tap to choose</div><div class="controls"><label>Format <select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><label>Quality <input id="quality" type="range" min=".1" max="1" step=".05" value=".9"></label></div><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script>setupDrop(async f=>{result.textContent='Converting…';try{const im=await loadImage(f),b=await canvasBlob(im,im.naturalWidth,im.naturalHeight,format.value,+quality.value);result.textContent='';downloadBlob(b,f.name.replace(/\.[^.]+$/,'')+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[format.value])}catch(e){result.textContent=e.message}},'image/*')</script></body></html>
