<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator — Free Online</title><meta name="description" content="Create and download QR codes for free."><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">FreeTools<span>AI</span></a></header><main class="tool-page"><a class="back" href="/">← All tools</a><h1>QR Code Generator</h1><p>Create a QR code from any URL or text.</p><div class="tool-card"><input id="text" style="width:100%;padding:14px;border:1px solid #e5e7eb;border-radius:10px" placeholder="https://example.com"><button id="go" class="btn primary" style="margin-top:12px">Generate</button><div id="out" class="result"></div></div></main><script>go.onclick=()=>{const v=encodeURIComponent(text.value.trim());if(!v)return;out.innerHTML='<img alt="QR code" style="max-width:280px;border-radius:12px" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+v+'"><p><a class="download" target="_blank" href="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data='+v+'">Open / save QR</a></p>'}</script></body></html>
