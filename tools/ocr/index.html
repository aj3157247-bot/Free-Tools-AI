<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR — Image to Text | FreeTools AI</title><meta name="description" content="Recognize text from images with browser-based Tesseract OCR."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>OCR — Image to Text</h1><p>Recognize text from images with browser-based Tesseract OCR.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop an image</strong>or tap to choose</div><div class="controls"><select id="lang"><option value="eng">English</option><option value="fas">Persian</option><option value="ara">Arabic</option></select><button id="go" class="btn primary">Run OCR</button></div><textarea id="text" style="width:100%;min-height:280px;margin-top:18px;padding:15px;border:1px solid #e5e7eb;border-radius:14px;font:inherit"></textarea><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"></script><script>let f;setupDrop(x=>{f=x;result.textContent='Image selected.'},'image/*');go.onclick=async()=>{if(!f)return result.textContent='Choose an image first.';result.textContent='Starting OCR…';try{const r=await Tesseract.recognize(f,lang.value,{logger:m=>{if(m.progress!=null)result.textContent='OCR '+Math.round(m.progress*100)+'%'}});text.value=r.data.text;result.textContent='OCR complete.'}catch(e){result.textContent=e.message}}</script></body></html>
