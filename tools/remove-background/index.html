<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove Background | FreeTools AI</title><meta name="description" content="Remove image backgrounds and download a transparent PNG."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>Remove Background</h1><p>Remove image backgrounds and download a transparent PNG.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop an image</strong>or tap to choose</div><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script>setupDrop(async f=>{result.textContent='Removing background…';try{const fd=new FormData();const buf=await f.arrayBuffer();fd.append('image_file',new Blob([buf],{type:f.type||'image/jpeg'}),f.name||'image.jpg');const r=await fetch('/api/remove-background',{method:'POST',body:fd});if(!r.ok){let t=await r.text();try{const j=JSON.parse(t);t=j.error+(j.detail?' — '+String(j.detail).slice(0,300):'')}catch(_){}throw Error(t)}const b=await r.blob();result.textContent='';downloadBlob(b,f.name.replace(/\.[^.]+$/,'')+'-no-bg.png')}catch(e){result.textContent=e instanceof TypeError?'Network error. Check your connection or turn off your VPN, then try again.':'Could not remove the background: '+e.message}},'image/*')</script><script src="/assets/site.js"></script></body></html>
