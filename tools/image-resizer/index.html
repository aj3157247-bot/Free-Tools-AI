<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — Resize Images Online Free</title><meta name="description" content="Resize images to exact width and height online for free."><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">FreeTools<span>AI</span></a></header><main class="tool-page"><a class="back" href="/">← All tools</a><h1>Image Resizer</h1><p>Resize images to exact dimensions in your browser.</p><div class="tool-card"><input id="file" type="file" accept="image/*" hidden><div id="drop" class="drop">Drop image or tap to choose</div><div class="row"><input id="w" type="number" placeholder="Width (px)"><input id="h" type="number" placeholder="Height (px)"><button id="go" class="btn primary">Resize</button></div><div id="out"></div></div></main><script src="/tools/common.js"></script><script>let f;setupDrop(file,drop,fs=>{f=fs[0];if(f)imageSize(f).then(s=>{w.value=s.w;h.value=s.h})});go.onclick=async()=>{if(!f)return out.textContent="Choose an image first.";try{const b=await imageCanvas(f,+w.value,+h.value,f.type==="image/png"?"image/png":"image/jpeg",.9);out.innerHTML="";dl(b,f.name.replace(/\.[^.]+$/,"")+"-"+w.value+"x"+h.value+"."+((f.type==="image/png")?"png":"jpg"))}catch(e){out.textContent=e.message}}</script></body></html>
