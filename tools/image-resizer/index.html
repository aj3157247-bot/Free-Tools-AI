<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer | FreeTools AI</title><meta name="description" content="Resize an image to exact width and height in pixels."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>Image Resizer</h1><p>Resize an image to exact width and height in pixels.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop an image</strong>or tap to choose</div><div class="controls"><input id="w" type="number" placeholder="Width"><input id="h" type="number" placeholder="Height"><button id="go" class="btn primary">Resize</button></div><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script>let current;setupDrop(async f=>{current=f;const im=await loadImage(f);w.value=im.naturalWidth;h.value=im.naturalHeight;result.textContent=`Original: ${im.naturalWidth} × ${im.naturalHeight}`},'image/*');go.onclick=async()=>{if(!current)return result.textContent='Choose an image first.';try{const im=await loadImage(current),b=await canvasBlob(im,+w.value,+h.value,current.type==='image/png'?'image/png':'image/jpeg',.9);result.textContent='';downloadBlob(b,current.name.replace(/\.[^.]+$/,'')+'-'+w.value+'x'+h.value+'.'+(current.type==='image/png'?'png':'jpg'))}catch(e){result.textContent=e.message}}</script></body></html>
