<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG to PDF | FreeTools AI</title><meta name="description" content="Convert JPG and PNG images into a PDF in your browser."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>JPG to PDF</h1><p>Convert JPG and PNG images into a PDF in your browser.</p></div><div class="workspace"><input id="file" type="file" accept="image/*" multiple hidden><div id="drop" class="drop"><strong>Drop images</strong>or tap to choose</div><div id="picked" style="display:none;margin-top:16px"><div id="list" style="font-weight:700;color:#344054;line-height:1.9;overflow-wrap:anywhere"></div><div class="controls"><button id="build" class="btn primary">Convert to PDF</button></div></div><div id="result" class="status"></div><div class="notice">Images are combined into one PDF in the order you select them.</div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.2/dist/jspdf.umd.min.js"></script><script>
let files=[];const input=qs('#file'),drop=qs('#drop'),picked=qs('#picked'),list=qs('#list'),build=qs('#build');
function pick(fs){files=[...fs].filter(f=>f.type.startsWith('image/'));result.textContent='';if(!files.length){picked.style.display='none';result.textContent='Choose an image first.';return}list.innerHTML='';files.forEach((f,i)=>{const d=document.createElement('div');d.append((i+1)+'. ');const b=document.createElement('bdi');b.dir='auto';b.textContent=f.name;const z=document.createElement('bdi');z.dir='ltr';z.textContent=' ('+humanSize(f.size)+')';d.append(b,z);list.append(d)});picked.style.display='block'}
drop.onclick=()=>input.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');pick(e.dataTransfer.files)};input.onchange=()=>pick(input.files);
build.onclick=async()=>{if(!files.length)return result.textContent='Choose an image first.';build.disabled=true;result.textContent='Converting…';try{let pdf;const MAX=2000;for(let i=0;i<files.length;i++){const im=await loadImage(files[i]),k=Math.min(1,MAX/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const jpg=c.toDataURL('image/jpeg',.92);if(i===0)pdf=new jspdf.jsPDF({unit:'px',format:[w,h],compress:true,orientation:w>h?'l':'p'});else pdf.addPage([w,h],w>h?'l':'p');pdf.addImage(jpg,'JPEG',0,0,w,h)}const b=pdf.output('blob');result.textContent='';downloadBlob(b,(files.length===1?files[0].name.replace(/\.[^.]+$/,''):'images')+'.pdf')}catch(e){result.textContent=e.message}finally{build.disabled=false}};
</script><script src="/assets/site.js"></script></body></html>
