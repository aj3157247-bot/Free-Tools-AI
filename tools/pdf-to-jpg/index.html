<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to JPG | FreeTools AI</title><meta name="description" content="Convert every PDF page to a JPG image in your browser."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>PDF to JPG</h1><p>Convert every PDF page to a JPG image in your browser.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop a PDF</strong>or tap to choose</div><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.worker.min.mjs';setupDrop(async f=>{result.textContent='Rendering…';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;result.textContent=pdf.numPages+' page(s) found.';for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),v=p.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));downloadBlob(b,'page-'+n+'.jpg')}}catch(e){result.textContent=e.message}},'application/pdf')</script></body></html>
