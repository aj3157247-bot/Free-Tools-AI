<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator | FreeTools AI</title><meta name="description" content="Create a downloadable QR code from any URL or text."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>QR Code Generator</h1><p>Create a downloadable QR code from any URL or text.</p></div><div class="workspace"><input id="value" style="width:100%;padding:14px;border:1px solid #e5e7eb;border-radius:11px;font:inherit" placeholder="https://example.com"><div class="controls"><button id="go" class="btn primary">Generate QR</button></div><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>go.onclick=async()=>{if(!value.value.trim())return result.textContent='Enter text or a URL.';result.innerHTML='';const c=document.createElement('canvas');result.append(c);await QRCode.toCanvas(c,value.value.trim(),{width:420,margin:2});const a=document.createElement('a');a.className='download';a.download='qr-code.png';a.href=c.toDataURL('image/png');a.textContent='Download QR PNG';result.append(a)}</script><script src="/assets/site.js"></script></body></html>
