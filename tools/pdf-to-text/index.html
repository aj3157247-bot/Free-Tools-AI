<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Text — Extract Text from PDF Free</title><meta name="description" content="Extract selectable text from PDF files directly in your browser."><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">FreeTools<span>AI</span></a></header><main class="tool-page"><a class="back" href="/">← All tools</a><h1>PDF to Text</h1><p>Extract text from text-based PDFs without uploading them.</p><div class="tool-card"><input id="file" type="file" accept="application/pdf" hidden><div id="drop" class="drop">Drop a PDF or tap to choose</div><pre id="out">Waiting for PDF…</pre></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script type="module">import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";setupDrop(file,drop,async fs=>{const f=fs[0];if(!f)return;out.textContent="Extracting…";try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),c=await page.getTextContent();t+=`\\n--- Page ${p} ---\\n`+c.items.map(x=>x.str).join(" ")+"\\n"}out.textContent=t||"No selectable text found. This may be a scanned PDF."}catch(e){out.textContent=e.message}})</script><script src="/tools/common.js"></script></body></html>
