<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Text | FreeTools AI</title><meta name="description" content="Extract selectable text from PDF files locally."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>PDF to Text</h1><p>Extract selectable text from PDF files locally.</p></div><div class="workspace"><input id="file" type="file" hidden><div id="drop" class="drop"><strong>Drop a PDF</strong>or tap to choose</div><textarea id="text" style="width:100%;min-height:320px;margin-top:18px;padding:15px;border:1px solid #e5e7eb;border-radius:14px;font:inherit"></textarea><div id="result" class="status"></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.54/build/pdf.worker.min.mjs';setupDrop(async f=>{result.textContent='Extracting…';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';for(let n=1;n<=pdf.numPages;n++){const c=await (await pdf.getPage(n)).getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n\n'}text.value=out;result.textContent=out.trim()?'Done.':'No selectable text found.'}catch(e){result.textContent=e.message}},'application/pdf')</script><script src="/assets/site.js"></script></body></html>
