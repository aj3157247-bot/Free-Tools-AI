<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor — Compress JPG PNG WebP Free</title><meta name="description" content="Compress images online for free. Reduce JPG, PNG and WebP file size in your browser."><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">FreeTools<span>AI</span></a></header><main class="tool-page"><a class="back" href="/">← All tools</a><h1>Image Compressor</h1><p>Reduce image file size before uploading or sharing.</p><div class="tool-card"><input id="file" type="file" accept="image/*" hidden><div id="drop" class="drop"><b>Drop an image here</b><br>or tap to choose</div><label>Quality <input id="quality" type="range" min=".1" max="1" step=".05" value=".7"></label><div id="out" class="result"></div></div></main><script src="/tools/common.js"></script><script>setupDrop(file,drop,async fs=>{const f=fs[0];if(!f)return;out.textContent="Compressing…";try{const s=await imageSize(f),type=f.type==="image/png"?"image/png":"image/jpeg";const b=await imageCanvas(f,s.w,s.h,type,+quality.value);out.innerHTML=`Original: ${(f.size/1024).toFixed(1)} KB · New: ${(b.size/1024).toFixed(1)} KB`;dl(b,f.name.replace(/\.[^.]+$/,"")+"-compressed."+type.split("/")[1])}catch(e){out.textContent=e.message}})</script></body></html>
