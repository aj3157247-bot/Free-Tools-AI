<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Summarizer | FreeTools AI</title><meta name="description" content="Summarize long text into clear key points."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>AI Summarizer</h1><p>Summarize long text into clear key points.</p></div><div class="workspace"><div class="aiWork"><textarea id="input" placeholder="Enter your text or request…"></textarea><div class="controls"><button id="go" class="btn primary">Run AI</button></div><div id="output" class="aiOutput">Your result appears here.</div></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script src="/assets/ai-client.js"></script><script>
document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("input");
  const go = document.getElementById("go");
  const output = document.getElementById("output");

  if (!input || !go || !output || !window.FreeToolsAI) {
    return;
  }

  const system = "Summarize the user's text accurately. Give a concise summary followed by key points. Do not invent facts.";

  const run = async () => {
    const value = input.value.trim();

    if (!value) {
      output.textContent = "Enter text first.";
      input.focus();
      return;
    }

    go.disabled = true;
    output.textContent = "Thinking…";

    try {
      output.textContent = await window.FreeToolsAI.request(
        value,
        system
      );
    } catch (error) {
      output.textContent = error?.message || "AI request failed.";
    } finally {
      go.disabled = false;
    }
  };

  go.addEventListener("click", run);

  input.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      event.preventDefault();
      run();
    }
  });
});
</script><script src="/assets/site.js"></script></body></html>
