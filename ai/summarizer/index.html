<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Summarizer | FreeTools AI</title><meta name="description" content="Summarize long text into clear key points."><link rel="stylesheet" href="/assets/app.css"></head><body><header class="nav"><a class="logo" href="/">FreeTools<span>AI</span></a><nav><a href="/#tools">Tools</a><a href="/#ai">AI</a></nav></header><main class="toolMain"><a class="back" href="/#tools">← All tools</a><div class="toolHead"><div class="toolEyebrow">FREE ONLINE TOOL</div><h1>AI Summarizer</h1><p>Summarize long text into clear key points.</p></div><div class="workspace"><div class="aiWork"><textarea id="input" placeholder="Enter your text or request…"></textarea><div class="controls"><button id="go" class="btn primary">Run AI</button></div><div id="output" class="aiOutput">Your result appears here.</div><div class="notice">AI calls are sent through your Cloudflare Worker. Never put an API key in frontend code.</div></div></div></main><footer><a class="logo" href="/">FreeTools<span>AI</span></a><span>Free tools for everyone.</span></footer><script src="/assets/tools.js"></script><script>go.onclick=async()=>{const v=input.value.trim();if(!v)return output.textContent='Enter text first.';output.textContent='Thinking…';try{const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:'Summarize the user text accurately. Give a concise summary followed by key points. Do not invent facts.'+'\n\nUSER TEXT:\n'+v})});const d=await r.json();if(!r.ok)throw Error(d.error||'AI request failed');output.textContent=d.text||'No response.'}catch(e){output.textContent=e.message}}</script><script src="/assets/site.js"></script></body></html>
